name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (clean, ignore scripts)
        run: npm ci --ignore-scripts

      - name: Run test suite
        run: npm test

  compat-pi-1-5:
    name: Pi 1.5.0 compatibility smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean, ignore scripts)
        run: npm ci --ignore-scripts

      - name: Install the Pi SDK version that production runs
        run: >-
          npm install --no-save
          @earendil-works/pi-coding-agent@1.5.0
          @earendil-works/pi-ai@1.5.0

      - name: Run compatibility smoke
        run: node scripts/compat/pi-1.5.0-smoke.mjs
